[package]
name = "gi-utils"
version = "1.4.0"
edition = "2024"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Media",
    # 线程采样（thread_info.rs）：NtQuerySystemInformation / NtQueryInformationThread /
    # QueryThreadCycleTime（WindowsProgramming）/ PROCESSOR_NUMBER（Kernel）
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_Kernel",
]}
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
# 只用 fmt 订阅器 — 关闭默认的 ansi/tracing-log/smallvec
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
# GUI 只需 glow 渲染后端（Renderer::default 优先 Glow，代码不显式设 renderer）
# + 内置字体。关闭默认的 wgpu、accesskit（无障碍）、links（超链接）、
# persistence（窗口状态持久化，本项目用 config.toml 自行保存）、x11/wayland。
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
] }

[build-dependencies]
embed-resource = "3"

# ==============================================================================
# 1. dev 模式：极限压榨编译速度（用于日常 cargo run / check 快速开发）
# ==============================================================================
[profile.dev]
opt-level = 0                 # 自身代码不做优化，编译速度拉到最快
debug = 0                     # 彻底关闭调试信息，零 PDB 磁盘写入，链接秒过
codegen-units = 256           # 最大化代码生成并行度
incremental = true            # 开启增量编译

# 关键：第三方依赖开启 2 级优化，保证 eframe/glow 界面拖拽丝滑不掉帧，且依赖只需编译一次
[profile.dev.package."*"]
opt-level = 2
debug = 0

# ==============================================================================
# 2. release 模式：激进极限优化（不惜编译时间，压榨极致体积与执行性能）
# ==============================================================================
[profile.release]
opt-level = 3                 # 最高级别激进优化
lto = "fat"                   # 全局跨 Crate 胖 LTO，彻底打通内联和死代码剔除
codegen-units = 1             # 单单元单线程编译，给 LLVM 最完整的全局拓扑视野
strip = true                  # 彻底剥离符号信息

# unwind（GUI 崩溃自愈的基础）：panic 时 Drop 防护体系（ActiveGuard、亲和性
# 恢复兜底）全部生效；GUI 侧 catch_unwind 捕获渲染线程 panic 并重试 —
# 睡眠唤醒后 wgl 上下文失效（eframe make_current unwrap）可自愈。
# 相比 abort 增加几十 KB unwind 表 — 早期"砍 30KB"的决策已被 GUI 体积稀释。
panic = "unwind"              
debug = false                 # 关闭调试符号
incremental = false           # Release 必须关闭增量，确保最高代码生成质量