[package]
name = "gi-utils"
version = "1.0.0"
edition = "2021"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Media",
]}
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
eframe = "0.31"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1
# Abort on panic: cuts ~30KB and avoids unwind tables.
# Trade-off: destructors (Drop) won't run on panic.
# Acceptable for a game utility — panics are fatal anyway.
panic = "abort"
debug = false

[[bin]]
name = "gi-utils"
path = "src/main.rs"

[[bin]]
name = "gi-utils-gui"
path = "src/bin/gui.rs"