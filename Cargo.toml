[package]
name = "gi-utils"
version = "1.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Media",
]}
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
# 只用 fmt 订阅器 — 关闭默认的 ansi/tracing-log/smallvec
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
# GUI 只需 glow 渲染后端（Renderer::default 优先 Glow，代码不显式设 renderer）
# + 内置字体。关闭默认的 wgpu、accesskit（无障碍）、links（超链接）、
# persistence（窗口状态持久化，本项目用 config.toml 自行保存）、x11/wayland。
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1
# Abort on panic: cuts ~30KB and avoids unwind tables.
# Trade-off: destructors (Drop) won't run on panic.
# Acceptable for a game utility — panics are fatal anyway.
panic = "abort"
debug = false

[[bin]]
name = "gi-utils"
path = "src/main.rs"

[[bin]]
name = "gi-utils-gui"
path = "src/bin/gui/main.rs"